<text x="434" y="1015" text-anchor="start" font-weight="bold">Function</text>
<rect x="1910" y="990" width="230" height="36" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="1914" y="1015" text-anchor="start" font-weight="bold">Source</text>
<rect x="2140" y="990" width="360" height="36" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="2144" y="1015" text-anchor="start" font-weight="bold">Interfaces (mnemonics)</text>
<rect x="100" y="1026" width="330" height="36" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="104" y="1051" text-anchor="start">TOP (m_vlsit_apbdec) frame</text>
<rect x="430" y="1026" width="1480" height="36" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="434" y="1051" text-anchor="start">Top module of the APB decoder. It is a single module without child modules.</text>
<rect x="1910" y="1026" width="230" height="36" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="1914" y="1051" text-anchor="start">Section 14.2</text>
<rect x="2140" y="1026" width="360" height="36" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="2144" y="1051" text-anchor="start">REQ, RRSP, SOUT, SRSP, CTL, CRCLK</text>
<rect x="100" y="1062" width="330" height="80" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="104" y="1109" text-anchor="start">m_vlsit_apbdec</text>
<rect x="430" y="1062" width="1480" height="80" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="434" y="1087" text-anchor="start">Decoder. It compares the transfer address with the closed address window of every slave, raises the select of the owner, gives every slave its</text>
<text x="434" y="1109" text-anchor="start">local address, forwards the transfer attributes, and returns the response of the selected slave or builds the response for an address that no slave</text>
<text x="434" y="1131" text-anchor="start">owns. With a register option it adds flip-flops on the inputs, on the outputs, or on both, and a state machine that keeps the APB phases correct.</text>
<rect x="1910" y="1062" width="230" height="80" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="1914" y="1109" text-anchor="start">Section 14.2</text>
<rect x="2140" y="1062" width="360" height="80" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="2144" y="1109" text-anchor="start">REQ, RRSP, SOUT, SRSP, CTL, CRCLK</text>
<rect x="100" y="1182" width="2400" height="512" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>

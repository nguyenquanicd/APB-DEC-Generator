<text x="838" y="473" text-anchor="end">(m_vlsit_apbdec)</text>
<text x="104" y="1775" text-anchor="start" font-weight="bold">Legend</text>
<text x="284" y="1816" text-anchor="start">Interface connector (one per signal group; arrow = active to passive)</text>
<text x="104" y="1891" text-anchor="start">The enclosing frame is the top module and holds one block, the decoder itself: the generated RTL is a single module without child modules. The clock and reset are present only when Register Inputs or Register Outputs is 1.</text>
<text x="530" y="666" text-anchor="middle">CRCLK</text>
<text x="530" y="688" text-anchor="middle">i_clk_apb, i_rst_n_apb</text>
<text x="915" y="666" text-anchor="middle">RRSP</text>
<text x="915" y="688" text-anchor="middle">o_pready, o_prdata, o_pslverr</text>
<text x="380" y="491" text-anchor="middle">REQ</text>
<text x="380" y="513" text-anchor="middle">i_paddr, i_psel, i_penable</text>
<text x="425" y="591" text-anchor="middle">CTL</text>
<text x="425" y="613" text-anchor="middle">i_unmapped_err_en</text>
<rect x="100" y="950" width="2400" height="192" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
<text x="1300" y="977" text-anchor="middle" font-weight="bold">Block Functions &amp; Interfaces</text>

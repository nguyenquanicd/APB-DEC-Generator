<text x="985" y="513" text-anchor="middle">o_psel_k, o_paddr_k</text>
<text x="1000" y="591" text-anchor="middle">SRSP</text>
<text x="1000" y="613" text-anchor="middle">i_pready_k, i_prdata_k</text>
